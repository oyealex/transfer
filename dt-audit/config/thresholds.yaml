# DT 质量审计配置
#
# 步骤 5 使用。SKILL.md 与 references 只引用名称，不重复数值。
# 标定后只改这里。

配置版本: "2.1"

# 证据完整度 = 可判定单元 / 全部候选单元。
# 低于下限时在报告中标「证据不足」提示，提示单独成行，不与质量问题混排。
证据完整度下限: 0.60

# 证据完整度的三档：≥完整 为「完整」，≥部分 为「部分」，低于部分 为「不足」。
证据完整度分档:
  完整: 0.90
  部分: 0.60

# 覆盖低水位。用于问题类型 D1 的严重度升级与报告措辞。
覆盖低水位: 0.40

# 判别性断言占比下限。用于问题类型 B2 的严重度升级。
判别性断言占比下限: 0.50

# 维度「一句话总评」的良好水位，只影响措辞，不影响计数。
良好水位:
  观测率: 0.70
  判别性断言占比: 0.70

# 问题类型 C1 的严重度升级：被替换决策点数量与架空率同时满足。
架空升级:
  点数下限: 3
  比率下限: 0.15

# 新增 DT 密度参考带（新增 DT 数 ÷ 变更生产代码千行）。
# 仅用于措辞，不参与计数。
密度参考:
  低: 5
  高: 30

# 双轮不一致率超过该值时，报告的 1.2 加「双轮一致性不足」说明，并在 3.1 记录分歧明细。
双轮不一致率上限: 0.20

# 低置信决策点占比超过该值时，扣减证据完整度。
低置信决策点占比上限: 0.20

# 判别力抽检的样本数量。
抽样数量:
  完整: 6
  受限: 3

# 语言能力档：完整 = 算观测率；受限 = 只做文件级关联。
语言能力:
  Java: 完整
  Python: 完整
  C: 受限
  C++: 受限
